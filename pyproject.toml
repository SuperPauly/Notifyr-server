[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifyr-server"
version = "0.1.0"
description = "Durable authenticated Notifyr inbox and Web Push server"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "protobuf>=6.33.5,<7", "loguru>=0.7,<1", "pywebpush>=2.0,<3", "dnspython>=2.8,<3"]

[project.scripts]
notifyr-admin = "notifyr.admin:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12", "mypy>=1.15", "bandit>=1.8", "grpcio-tools==1.78.0", "types-protobuf", "types-requests", "pre-commit>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/notifyr"]

[tool.hatch.envs.default]
python = "3.13"
installer = "uv"
skip-install = true
dependencies = ["uv==0.9.28"]

[tool.hatch.envs.default.scripts]
serve = "uv run --frozen uvicorn notifyr.api:app --host 0.0.0.0 --port 8080 --workers 1 --no-access-log"
proto = "uv run --frozen --group dev python scripts/generate_proto.py"
test = "uv run --frozen --group dev pytest -q"
lint = "uv run --frozen --group dev ruff check ."
types = "uv run --frozen --group dev mypy src/notifyr"
security = "uv run --frozen --group dev bandit -q -r src/notifyr -x src/notifyr/notifications_pb2.py"
check = ["proto", "lint", "types", "security", "test"]
admin = "uv run --frozen notifyr-admin {args}"
smoke = "uv run --frozen --group dev python scripts/container_smoke.py"


[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["graft", "src/notifyr/notifications_pb2.py", "src/notifyr/notifications_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
exclude = "notifications_pb2.py"

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
