repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --frozen --group dev ruff check
        language: system
        types: [python]
        exclude: notifications_pb2\.(py|pyi)$
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --frozen --group dev ruff format --check
        language: system
        types: [python]
        exclude: notifications_pb2\.(py|pyi)$
      - id: mypy
        name: MyPy
        entry: uv run --frozen --group dev mypy src/notifyr
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: Bandit
        entry: uv run --frozen --group dev bandit -q -r src/notifyr -x src/notifyr/notifications_pb2.py
        language: system
        pass_filenames: false
        types: [python]
